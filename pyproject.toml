[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crania-ccr"
version = "26.11.3.post3"
description = "CCR: geographic recipes, polygon rendering and durable local cache"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
png = ["PyMuPDF>=1.24"]

[project.scripts]
ccr = "ccr.cli:main"

[project.entry-points."crania_agent.components"]
ccr = "ccr.cm:describe"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
ccr = ["skills/*/SKILL.md", "recipes/*.json", "prompts/*.md", "runtime/*.mjs", "runtime/*.json"]

# Portable consumer documentation; no checkout or private instance files.
[tool.setuptools.data-files]
"share/doc/crania-ccr" = ["README.md"]
"share/doc/crania-ccr/config/prompts" = ["config/prompts/render.prompt.json", "config/prompts/render.prompt.md"]
"share/doc/crania-ccr/docs" = ["docs/CCR-ACTIONS.md", "docs/CCR-RICH-DOCUMENT.md", "docs/CHAT-PRESENTATION-CONTRACT.md", "docs/CONTEXTUAL-VIEWS-CONTRACT.md", "docs/GIT-ORIGIN.md", "docs/PROGRESSIVE-HISTORY-CONTRACT.md", "docs/RICH-CONTENT-CONSUMERS.md", "docs/compatibility-matrix.md", "docs/document-export.md", "docs/geographic-map.md", "docs/geographic-recipes.md", "docs/history.md", "docs/installed-package.md", "docs/progressive-history.md", "docs/shared-render-plan.md"]
"share/doc/crania-ccr/python/ccr/prompts" = ["python/ccr/prompts/document-export.md"]
"share/doc/crania-ccr/python/ccr/skills/document-export" = ["python/ccr/skills/document-export/SKILL.md"]
"share/doc/crania-ccr/python/ccr/skills/geographic-map" = ["python/ccr/skills/geographic-map/SKILL.md"]
